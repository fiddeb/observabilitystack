# helm/umbrella-chart/Chart.yaml
apiVersion: v2
name: observability-stack
version: 0.1.0
dependencies:
  - name: loki
    version: "6.36.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: tempo
    version: "1.23.3"
    repository: "https://grafana.github.io/helm-charts"
    condition: tempo.enabled

  - name: prometheus
    version: "27.46.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled

  - name: grafana
    version: "12.1.1"
    repository: "https://grafana-community.github.io/helm-charts"
    condition: grafana.enabled
  # Using local chart from NGDATA fork with monolithic support
  - name: mimir-distributed
    version: "5.9.0-weekly.365"
    repository: "file://./charts/mimir-distributed"
    condition: mimir.enabled
    alias: mimir

  # Using local chart vendored from the official Garage repository
  # https://git.deuxfleurs.fr/Deuxfleurs/garage (script/helm/garage)
  - name: garage
    version: "0.9.3"
    repository: "file://./charts/garage"
    condition: garage.enabled
  - name: opentelemetry-collector
    version: "0.150.1"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: opentelemetry-collector.enabled
  - name: perses
    version: "0.20.0"
    repository: "https://perses.github.io/helm-charts"
    condition: persesEnabled
  - name: spaceport
    version: "0.5.0"
    repository: "oci://ghcr.io/fiddeb/charts"
    condition: spaceport.enabled