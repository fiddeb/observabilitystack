# Garage configuration profile
# S3-compatible object storage (https://garagehq.deuxfleurs.fr/)
#
# This file is an opt-in profile ("smart switch"):
#   - Included  -> Garage is deployed AND Loki/Tempo use S3 storage (Garage)
#   - Excluded  -> Garage is not deployed AND Loki/Tempo use local filesystem
#
# Enable by uncommenting `values/garage.yaml` in argocd/observability-stack.yaml
# (or by adding `-f helm/stackcharts/values/garage.yaml` to helm commands).
#
# After the first deployment, run ./scripts/setup_garage.sh to initialize
# the cluster layout, create the buckets and import the S3 credentials.
#
# S3 credentials are stored in the `garage-credentials` Kubernetes Secret
# (rendered from garageCredentials below by templates/garage-credentials.yaml).
# Loki and Tempo read them as environment variables via -config.expand-env,
# so the keys never appear in their rendered ConfigMaps.
#
# NOTE: these are static lab credentials (like the previous minio/minio123).
# Override them for anything beyond a local lab environment.

garageCredentials:
  accessKeyId: GK0123456789abcdef01234567
  secretAccessKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  # Full-scope admin API token (Garage v2). Enables the admin API so that
  # garage-webui can manage buckets/keys/layout. Static lab value — override
  # for anything beyond a local lab. Generate with: openssl rand -base64 32
  adminToken: "Zy3vK8mQpR2sT5wX9bN1cD4fH7jL0aE6gU8iO3kP2nQ="

garage:
  enabled: true
  fullnameOverride: garage

  # Inject the admin token into the Garage daemon as an environment variable
  # (GARAGE_ADMIN_TOKEN overrides [admin].admin_token). Metrics stay open since
  # metrics_require_token is not set, so Prometheus scraping is unaffected.
  environment:
    - name: GARAGE_ADMIN_TOKEN
      valueFrom:
        secretKeyRef:
          name: garage-credentials
          key: GARAGE_ADMIN_TOKEN

  garage:
    # Single-node lab setup
    replicationFactor: "1"
    consistencyMode: "consistent"
    # LMDB relies on mmap features that some filesystems (e.g. Rancher Desktop
    # lima hostPath volumes) do not implement, causing the pod to crash with
    # "Cannot open LMDB database: Function not implemented (os error 38)".
    # sqlite avoids that dependency and works on those volumes.
    dbEngine: sqlite
    s3:
      api:
        region: "garage"
        rootDomain: ".s3.garage.k8s.test"

  deployment:
    kind: StatefulSet
    replicaCount: 1

  persistence:
    enabled: true
    meta:
      size: 100Mi
    data:
      size: 2Gi

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  monitoring:
    metrics:
      enabled: true

# --- garage-webui: admin UI for Garage (buckets, keys, layout, browser) ---
# Rendered by templates/garage-webui.yaml, gated on garage.enabled + enabled.
# Talks to the Garage admin API on garage-metrics:3903 using the admin token.
garageWebui:
  enabled: true
  image: khairul169/garage-webui:1.1.0
  ingress:
    enabled: true
    host: garage.k8s.test

# --- Loki: switch storage from filesystem to S3 (Garage) ---
loki:
  singleBinary:
    # Expand ${...} environment variables in the Loki config
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: garage-credentials
  loki:
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        endpoint: http://garage:3900
        region: garage
        # Expanded from the garage-credentials Secret at runtime
        accessKeyId: ${GARAGE_ACCESS_KEY_ID}
        secretAccessKey: ${GARAGE_SECRET_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true
    # schemaConfig is replaced wholesale (lists are not merged by Helm)
    schemaConfig:
      configs:
      - from: "2024-01-01"
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: s3
        schema: v13
    compactor:
      # With object storage, Loki requires delete requests to be stored in
      # the object store (overrides the filesystem default in values/loki.yaml).
      delete_request_store: s3

# --- Tempo: switch storage from local to S3 (Garage) ---
tempo:
  tempo:
    # Expand ${...} environment variables in the Tempo config
    extraArgs:
      config.expand-env: "true"
    extraEnvFrom:
      - secretRef:
          name: garage-credentials
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: garage:3900
          region: garage
          # Expanded from the garage-credentials Secret at runtime
          access_key: ${GARAGE_ACCESS_KEY_ID}
          secret_key: ${GARAGE_SECRET_ACCESS_KEY}
          insecure: true
          forcepathstyle: true
        wal:
          path: /var/tempo/wal
