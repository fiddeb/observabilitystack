# Prometheus configuration
# Metrics collection and storage

prometheus:
  rbac:
    create: true

  podSecurityPolicy:
    enabled: false

  serviceAccounts:
    server:
      create: true
      name: ""

  configmapReload:
    reloadUrl: ""
    prometheus:
      enabled: true
      name: configmap-reload
      image:
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: v0.78.1
        pullPolicy: IfNotPresent
      containerPort: 8080
      containerPortName: metrics
      livenessProbe:
        httpGet:
          path: /healthz
          port: metrics
          scheme: HTTP
        periodSeconds: 10
        initialDelaySeconds: 2
      readinessProbe:
        httpGet:
          path: /healthz
          port: metrics
          scheme: HTTP
        periodSeconds: 10
      startupProbe:
        enabled: false
        httpGet:
          path: /healthz
          port: metrics
          scheme: HTTP
        periodSeconds: 10

  server:
    name: server
    releaseNamespace: false
    image:
      repository: quay.io/prometheus/prometheus
      pullPolicy: IfNotPresent
    enableServiceLinks: true
    extraFlags:
      - web.enable-lifecycle
      - web.enable-remote-write-receiver
      - web.enable-otlp-receiver
      - enable-feature=promql-experimental-functions
      - enable-feature=exemplar-storage
    configPath: /etc/config/prometheus.yml
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 30s
      metric_name_validation_scheme: legacy
    fullnameOverride: "prometheus"
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations: {}
      path: /
      pathType: Prefix
      hosts:
        - prometheus.k8s.test
    strategy:
      type: Recreate
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    persistentVolume:
      enabled: true
      accessModes:
        - ReadWriteOnce
      mountPath: /data
      size: 8Gi
    replicaCount: 1
    readinessProbeInitialDelay: 30
    readinessProbePeriodSeconds: 5
    readinessProbeTimeout: 4
    readinessProbeFailureThreshold: 3
    readinessProbeSuccessThreshold: 1
    livenessProbeInitialDelay: 30
    livenessProbePeriodSeconds: 15
    livenessProbeTimeout: 10
    livenessProbeFailureThreshold: 3
    livenessProbeSuccessThreshold: 1
    startupProbe:
      enabled: false
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 10
    hostNetwork: false
    dnsPolicy: ClusterFirst
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      runAsGroup: 65534
      fsGroup: 65534
    service:
      enabled: true
      servicePort: 80
      sessionAffinity: None
      type: ClusterIP
    terminationGracePeriodSeconds: 300
    retention: "15d"
    extraConfigmapMounts:
      - name: slo-rules
        mountPath: /etc/prometheus/rules/slo-rules
        configMap: slo-rules
        readOnly: true

  serverFiles:
    prometheus.yml:
      otlp:
        translation_strategy: UnderscoreEscapingWithSuffixes
        promote_resource_attributes:
          - service.instance.id
          - service.name
          - service.namespace
          - service.version
          - cloud.availability_zone
          - cloud.region
          - container.name
          - deployment.environment
          - deployment.environment.name
          - k8s.cluster.name
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.daemonset.name
          - k8s.deployment.name
          - k8s.job.name
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.replicaset.name
          - k8s.statefulset.name
      rule_files:
        - /etc/config/recording_rules.yml
        - /etc/config/alerting_rules.yml
        - /etc/config/rules
        - /etc/config/alerts
        - /etc/prometheus/rules/slo-rules/*.yaml
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets:
                - localhost:9090
        # Garage S3 exposes Prometheus metrics on its admin API (port 3903).
        # job_name must be "garage" to match the {job="garage"} queries in the
        # Garage Grafana dashboard (templates/grafana-dashboard-garage.yaml).
        # Only reachable when values/garage.yaml is included; otherwise the
        # target is simply reported as down.
        - job_name: garage
          static_configs:
            - targets:
                - garage-metrics:3903

  alertmanager:
    enabled: false

  kube-state-metrics:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  prometheus-pushgateway:
    enabled: false
