# Base configuration - Component enable/disable flags
# This file controls which components are installed

loki:
  enabled: true

tempo:
  enabled: true

prometheus:
  enabled: true

grafana:
  enabled: true

mimir:
  enabled: false

# S3-compatible object storage (Garage).
# Disabled by default - Loki and Tempo then use local filesystem storage.
# To enable, include values/garage.yaml (sets garage.enabled=true and
# switches Loki/Tempo to S3 storage backed by Garage).
garage:
  enabled: true

opentelemetry-collector:
  enabled: true

persesEnabled: true

spaceport:
  enabled: true
