{{/*
  S3 credentials for Garage, shared by Loki and Tempo.
  Only rendered when Garage is enabled (values/garage.yaml).
  Loki and Tempo consume these as environment variables
  (via extraEnvFrom + -config.expand-env=true) so the keys
  never appear in their rendered ConfigMaps.
*/}}
{{- if .Values.garage.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  GARAGE_ACCESS_KEY_ID: {{ required "garageCredentials.accessKeyId is required when garage is enabled" .Values.garageCredentials.accessKeyId | quote }}
  GARAGE_SECRET_ACCESS_KEY: {{ required "garageCredentials.secretAccessKey is required when garage is enabled" .Values.garageCredentials.secretAccessKey | quote }}
{{- end }}
